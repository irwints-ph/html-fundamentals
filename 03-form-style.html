<!DOCTYPE html>
<html>
<head>
  <title>Styled Form</title>

  <style>
    body {
      font-family: Arial;
      background-color: #f4f4f4;
    }

    .container {
      width: 400px;
      margin: 100px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>

</head>
<body>

  <div class="container">
    
    <h2>Contact Form</h2>

    <form action="success.html" method="GET">

      <label>Name:</label><br>
      <input type="text" name="name" required>

      <label>Email:</label><br>
      <input type="email" name="email" required>

      <button type="submit">Submit</button>

    </form>

  </div>

</body>
</html>
